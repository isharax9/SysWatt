name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

jobs:
  package:
    runs-on: windows-latest
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      DOTNET_NOLOGO: 1
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet restore SysWatt.sln --configfile NuGet.Config
      - run: dotnet build SysWatt.sln --no-restore --configuration Release
      - run: dotnet test SysWatt.sln --no-build --configuration Release
      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y
      - name: Package
        shell: pwsh
        run: ./scripts/package.ps1 -Version '${{ github.ref_name }}'.Substring(1)
      - uses: actions/upload-artifact@v4
        with:
          name: SysWatt-${{ github.ref_name }}
          path: |
            artifacts/*.zip
            artifacts/*.exe
            artifacts/SHA256SUMS.txt
      - name: Create GitHub release
        shell: pwsh
        run: |
          $files = Get-ChildItem artifacts -File | Where-Object { $_.Extension -in '.zip', '.exe', '.txt' } | ForEach-Object FullName
          $arguments = @('release', 'create', '${{ github.ref_name }}') + $files + @('--generate-notes', '--verify-tag')
          if ('${{ github.ref_name }}'.Contains('-')) { $arguments += '--prerelease' }
          gh @arguments
